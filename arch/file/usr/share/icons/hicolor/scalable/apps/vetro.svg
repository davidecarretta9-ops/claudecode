<?xml version="1.0" encoding="UTF-8"?>
<!-- Il logo di Vetro (creato da vetro-arch.sh): una "V" di vetro azzurro -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="vetro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ad6ff"/>
      <stop offset="1" stop-color="#1a8cff"/>
    </linearGradient>
    <linearGradient id="luce" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
