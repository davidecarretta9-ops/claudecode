# Creato da Impostazioni (desktop Vetro): non modificarlo a mano,
# le tue aggiunte vanno in ~/.config/hypr/personale.conf
animations {
    enabled = true
}
decoration {
    rounding = 14
    blur {
        enabled = true
    }
}
general {
    gaps_in = 6
    gaps_out = 12
}
windowrule {
    name = vetro-finestre-libere
    match:class = .*
    float = yes
}
