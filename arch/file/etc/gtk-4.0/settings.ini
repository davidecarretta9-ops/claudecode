# vetro-arch.sh: programmi GTK scuri (come oversicaOS) con l'accento arancio (CSS in /etc/xdg/vetro), carattere
# DM Sans e puntatori Vetro
[Settings]
gtk-theme-name=Adwaita
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=Vetro
gtk-cursor-theme-size=24
gtk-font-name=DM Sans 11
