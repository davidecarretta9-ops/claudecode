# La rete di oversicaOS (creato da lfs.sh): NetworkManager, che usa anche Caelestia.
# I nomi dei siti (DNS) non vengono dal router: li chiede systemd-resolved a Quad9 in modo
# cifrato, o a Tor in modalita' fantasma. Il nome del computer non va al router.
[main]
dns=none
rc-manager=unmanaged

[connection]
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
ipv6.ip6-privacy=2

[device]
wifi.scan-rand-mac-address=yes
