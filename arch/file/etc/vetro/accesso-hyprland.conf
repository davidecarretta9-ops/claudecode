# vetro-arch.sh: Hyprland solo per la schermata di accesso (lo apre greetd come utente
# "greeter"). Niente tasti: si scrive solo la password. Quando la schermata ha finito
# (password giusta) si chiude anche questo Hyprland e parte il desktop.
monitor = , preferred, auto, 1
# nelle macchine virtuali (QEMU) all'accensione lo schermo partirebbe piccolo
monitor = Virtual-1, 1920x1080, auto, 1
# la tastiera italiana, come nel desktop (se no la password non si scrive uguale)
input {
    kb_layout = it
}

env = XCURSOR_SIZE, 24
env = XCURSOR_THEME, Vetro
env = QT_QPA_PLATFORM, wayland
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    disable_hyprland_guiutils_check = true
    disable_watchdog_warning = true
}
cursor {
    no_hardware_cursors = 1
}
exec-once = qs -p /etc/xdg/quickshell/vetro/accesso.qml; hyprctl dispatch exit
