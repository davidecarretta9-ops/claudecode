# Creato da vetro-arch.sh: nomi dei siti chiesti a Quad9 (Svizzera, non registra chi
# chiede) in modo cifrato. Se in qualche rete (hotel, ufficio) i siti non si aprono,
# si puo' cambiare DNSOverTLS=yes in DNSOverTLS=opportunistic.
# La modalita' fantasma (99-fantasma.conf, letto dopo) manda invece i nomi a Tor.
[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net
FallbackDNS=
DNSOverTLS=yes
Domains=~.
LLMNR=no
MulticastDNS=no
